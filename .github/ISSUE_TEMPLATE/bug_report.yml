name: Bug report
description: Report a reproducible problem in Trader Planner Pro
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, passwords, recovery codes, or private financial information.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or logs
      description: Remove any sensitive information before attaching.
