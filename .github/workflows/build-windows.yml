name: CI + Windows EXE + Installer + V10
# Production verification: Quality -> Build EXE -> Installer -> Smoke Test -> Release

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/**", "v10-professional-visual-online" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: trader-planner-v10-selfhost
  cancel-in-progress: true

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bootstrap Python 3.12
        shell: cmd
        run: |
          set "PY_DIR=%LocalAppData%\Programs\Python\Python312"
          if not exist "%PY_DIR%\python.exe" (
            echo Python 3.12 not found. Downloading the reproducible build runtime...
            curl.exe -L --fail --retry 3 -o "%TEMP%\python-3.12.10-amd64.exe" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            if errorlevel 1 exit /b 1
            "%TEMP%\python-3.12.10-amd64.exe" /quiet InstallAllUsers=0 PrependPath=0 Include_pip=1 Include_test=0
            if errorlevel 1 exit /b 1
          )
          if not exist "%PY_DIR%\python.exe" exit /b 1
          "%PY_DIR%\python.exe" --version
      - name: Install test/build dependencies
        shell: cmd
        run: |
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m pip install --upgrade pip pytest pyinstaller pillow tzdata jdatetime hijridate pywebview pywinstyles matplotlib reportlab google-auth google-auth-oauthlib google-api-python-client openai-agents
      - name: Syntax check
        shell: cmd
        run: |
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile TraderPlannerPro_v7_0_3.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile TraderPlannerPro_v7.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile launcher.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile logo_3d.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile branding_assets.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile prepare_branding.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile academy_visuals.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile market_data.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile calendar_utils.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile ai_assistant.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile news_data.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile webview_runner.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile prepare_education_assets.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile glass_theme.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile academy_diagrams.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile google_oauth.py
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m py_compile statement_report.py
      - name: Run tests
        shell: cmd
        run: |
          "%LocalAppData%\Programs\Python\Python312\python.exe" -m pytest -q

  package:
    needs: quality
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bootstrap Python 3.12
        shell: cmd
        run: |
          set "PY_DIR=%LocalAppData%\Programs\Python\Python312"
          if not exist "%PY_DIR%\python.exe" (
            curl.exe -L --fail --retry 3 -o "%TEMP%\python-3.12.10-amd64.exe" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            if errorlevel 1 exit /b 1
            "%TEMP%\python-3.12.10-amd64.exe" /quiet InstallAllUsers=0 PrependPath=0 Include_pip=1 Include_test=0
            if errorlevel 1 exit /b 1
          )
          if not exist "%PY_DIR%\python.exe" exit /b 1
          "%PY_DIR%\python.exe" --version
      - name: Install build dependencies
        shell: cmd
        run: |
          set "PY_EXE=%LocalAppData%\Programs\Python\Python312\python.exe"
          "%PY_EXE%" -m pip install --upgrade pip
          "%PY_EXE%" -m pip install -r requirements.txt pyinstaller
      - name: Prepare premium branding and exact education image assets
        shell: cmd
        run: "%LocalAppData%\Programs\Python\Python312\python.exe" prepare_branding.py
      - name: Prepare exact education image assets
        shell: cmd
        run: "%LocalAppData%\Programs\Python\Python312\python.exe" prepare_education_assets.py
      - name: Build Windows icon
        shell: cmd
        run: "%LocalAppData%\Programs\Python\Python312\python.exe" build_icon.py
      - name: Build EXE
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TraderPlannerPro
          --hidden-import tkinter
          --hidden-import tkinter.font
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.filedialog
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import json
          --hidden-import csv
          --hidden-import datetime
          --hidden-import pathlib
          --hidden-import shutil
          --hidden-import re
          --hidden-import uuid
          --collect-all tzdata
          --collect-all webview
          --collect-all agents
          --collect-all matplotlib
          --collect-all reportlab
          --hidden-import webview.platforms.edgechromium
          --hidden-import glass_theme
          --hidden-import academy_diagrams
          --hidden-import pywinstyles
          --hidden-import googleapiclient.discovery
          --hidden-import google_auth_oauthlib.flow
          --add-data "education_sources;education_sources"
          --add-data "trading_chart.html;."
          launcher.py
      - name: Verify EXE
        shell: cmd
        run: |
          if not exist "dist\TraderPlannerPro.exe" exit /b 1
          for %%A in ("dist\TraderPlannerPro.exe") do if %%~zA LSS 1000000 exit /b 1
      - name: Launch EXE smoke test
        shell: cmd
        run: |
          start "" /b "dist\TraderPlannerPro.exe"
          timeout /t 10 /nobreak >nul
          tasklist /FI "IMAGENAME eq TraderPlannerPro.exe" | find /I "TraderPlannerPro.exe" >nul
          if errorlevel 1 exit /b 1
          taskkill /F /IM TraderPlannerPro.exe >nul 2>&1
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer smoke test
        shell: cmd
        run: |
          if not exist "installer\TraderPlannerPro_Setup_v10.0.0.exe" exit /b 1
          if exist "%TEMP%\TraderPlannerPro-CI-Test" rmdir /s /q "%TEMP%\TraderPlannerPro-CI-Test"
          mkdir "%TEMP%\TraderPlannerPro-CI-Test\App"
          "installer\TraderPlannerPro_Setup_v10.0.0.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="%TEMP%\TraderPlannerPro-CI-Test\App"
          if errorlevel 1 exit /b 1
          if not exist "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe" exit /b 1
          start "" /b "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe"
          timeout /t 10 /nobreak >nul
          tasklist /FI "IMAGENAME eq TraderPlannerPro.exe" | find /I "TraderPlannerPro.exe" >nul
          if errorlevel 1 exit /b 1
          taskkill /F /IM TraderPlannerPro.exe >nul 2>&1
          if not exist "%TEMP%\TraderPlannerPro-CI-Test\App\unins000.exe" exit /b 1
          "%TEMP%\TraderPlannerPro-CI-Test\App\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if errorlevel 1 exit /b 1
          if exist "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe" exit /b 1

      - name: Publish V10.0.0 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v10-professional-visual-online')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v10.0.0-selfhost
          name: Trader Planner Pro V10.0.0 — Verified Windows Runner
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ## Trader Planner Pro V10.0.0

            Verified Windows self-hosted build of Trader Planner Pro V10.0.0 — premium branded native Windows glass workspace, integrated Trading Desk, Windows theme sync, persistent AI Command Center, multi-agent routing, live market/news fallbacks, and separate SMC, ICT and candlestick Academy semantics.

          files: |
            dist/TraderPlannerPro.exe
            installer/TraderPlannerPro_Setup_v10.0.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
