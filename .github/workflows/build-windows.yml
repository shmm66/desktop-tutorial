name: Trader Planner Pro — Windows Production Build

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  APP_VERSION: "8.4.0"

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Syntax and import compilation
        shell: powershell
        run: |
          python -m py_compile TraderPlannerPro_v7_0_3.py
          python -m py_compile TraderPlannerPro_v7.py
          python -m py_compile launcher.py
          python -m py_compile logo_3d.py
          python -m py_compile branding_assets.py
          python -m py_compile prepare_branding.py
          python -m py_compile academy_visuals.py
          python -m py_compile academy_diagrams.py
          python -m py_compile prepare_education_assets.py
          python -m py_compile market_data.py
          python -m py_compile calendar_utils.py
          python -m py_compile ai_assistant.py
          python -m py_compile news_data.py
          python -m py_compile webview_runner.py
          python -m py_compile glass_theme.py
          python -m py_compile google_oauth.py
          python -m py_compile statement_report.py
      - name: Run regression suite
        run: python -m pytest -q

  package:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Prepare exact education assets
        shell: powershell
        run: python prepare_education_assets.py
      - name: Build Windows icon
        shell: powershell
        run: python build_icon.py
      - name: Build EXE
        shell: powershell
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name TraderPlannerPro
          --hidden-import tkinter --hidden-import tkinter.font
          --hidden-import tkinter.messagebox --hidden-import tkinter.filedialog
          --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk
          --hidden-import json --hidden-import csv --hidden-import datetime
          --hidden-import pathlib --hidden-import shutil --hidden-import re --hidden-import uuid
          --collect-all tzdata --collect-all webview --collect-all matplotlib --collect-all reportlab
          --hidden-import webview.platforms.edgechromium --hidden-import glass_theme
          --hidden-import academy_diagrams --hidden-import pywinstyles
          --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow
          --add-data "education_sources;education_sources" launcher.py
      - name: Verify binary
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\TraderPlannerPro.exe"
          if (!(Test-Path $exe)) { throw "EXE was not produced." }
          if ((Get-Item $exe).Length -lt 1000000) { throw "EXE is unexpectedly small." }
          Get-FileHash $exe -Algorithm SHA256
      - name: Launch EXE smoke test
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\TraderPlannerPro.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "TraderPlannerPro.exe exited during startup with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer lifecycle smoke test
        shell: powershell
        run: |
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $installer = Get-ChildItem "$PWD\installer" -File -Filter "TraderPlannerPro_Setup_v8.4.0.exe" | Select-Object -First 1
          if (!$installer) { throw "Expected installer was not produced." }
          $testRoot = Join-Path $env:TEMP "TraderPlannerPro-CI-v840"
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $installDir = Join-Path $testRoot "App"
          $logFile = Join-Path $testRoot "install.log"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$logFile","/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { if (Test-Path $logFile) { Get-Content $logFile | Write-Host }; throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "TraderPlannerPro.exe"
          if (!(Test-Path $installedExe)) { throw "Installed EXE missing." }
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Installed EXE exited with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller missing." }
          $unLog = Join-Path $testRoot "uninstall.log"
          $un = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$unLog") -Wait -PassThru
          if ($un.ExitCode -ne 0) { if (Test-Path $unLog) { Get-Content $unLog | Write-Host }; throw "Uninstaller failed with exit code $($un.ExitCode)" }
          if (Test-Path $installedExe) { throw "Installed EXE still exists after uninstall." }
          if (Test-Path $uninstaller) { throw "Uninstaller still exists after uninstall." }
          Write-Host "Installer lifecycle PASS."
      - name: Publish release
        if: github.event_name == "push" && github.ref == "refs/heads/main"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.4.0
          name: Trader Planner Pro V8.4.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ## Trader Planner Pro V8.4.0

            Stable Windows build with native Acrylic glass + widget translucency, synchronous Home navigation, resilient market/news fallbacks, an active GPT-5.6 Sol master agent with optional web search, Google/Gmail reporting, and a rebuilt source-backed Academy with distinct SMC / ICT / candlestick semantics.
          files: |
            dist/TraderPlannerPro.exe
            installer/TraderPlannerPro_Setup_v8.4.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
