name: CI + Windows EXE + Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test/build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller pillow
      - name: Syntax check
        run: |
          python -m py_compile TraderPlannerPro_v7_0_3.py
          python -m py_compile TraderPlannerPro_v7.py
          python -m py_compile launcher.py
          python -m py_compile logo_3d.py
          python -m py_compile branding_assets.py
          python -m py_compile prepare_branding.py
      - name: Run tests
        run: python -m pytest -q

  package:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build EXE from V7.0.3 launcher
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TraderPlannerPro
          --hidden-import tkinter
          --hidden-import tkinter.font
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.filedialog
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import json
          --hidden-import csv
          --hidden-import datetime
          --hidden-import pathlib
          --hidden-import shutil
          --hidden-import re
          --hidden-import uuid
          launcher.py
      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\TraderPlannerPro.exe'
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small.' }
      - name: Launch EXE smoke test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\TraderPlannerPro.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "TraderPlannerPro.exe exited during startup with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer install-launch-uninstall smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          $testRoot = Join-Path $env:TEMP 'TraderPlannerPro-CI-Test'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $installDir = Join-Path $testRoot 'App'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'TraderPlannerPro.exe'
          if (-not (Test-Path $installedExe)) { throw "Installed EXE not found: $installedExe" }
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed EXE exited during startup with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $un = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($un.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $installedExe) { throw 'Installed EXE still exists after uninstall.' }
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
      - name: Publish V7.0.3 release assets
        if: github.ref == 'refs/heads/feature/trader-planner-pro-7-0-3-profiles-dashboard'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $releaseTag = 'v7.0.3'
          $title = 'Trader Planner Pro V7.0.3'
          $notes = @'
## Trader Planner Pro V7.0.3

Patch release with:
- visible 3D logo branding
- customizable and reorderable Checklist
- Trading Plan versioning and A4 PNG export
- independent journal profiles with separate initial capital
- home dashboard bar/pie analytics
- migration of existing V7.0.2 local data without deleting the previous data file
- Windows installer upgrade path using the existing AppId
'@
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
            gh release create $releaseTag --target $env:GITHUB_SHA --title $title --notes-file release-notes.md
          }
          $installer = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Installer asset not found for release upload.' }
          gh release upload $releaseTag (Join-Path $PWD 'dist\TraderPlannerPro.exe') $installer.FullName --clobber
