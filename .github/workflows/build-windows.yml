name: Build Windows EXE + Installer
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab openpyxl google-api-python-client google-auth google-auth-oauthlib tzdata
      - name: Syntax check
        run: python -m py_compile TraderPlannerPro_v3.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TraderPlannerPro TraderPlannerPro_v3.py
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Verify installer exists
        shell: powershell
        run: |
          $p = Join-Path $PWD 'installer\TraderPlannerPro_Setup_v3.exe'
          if (!(Test-Path $p)) { Write-Host 'Installer files:'; Get-ChildItem -Recurse installer -ErrorAction SilentlyContinue; throw "Installer not found: $p" }
          Get-Item $p | Format-List FullName,Length
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TraderPlannerPro-Windows11-EXE
          path: dist/TraderPlannerPro.exe
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: TraderPlannerPro-Windows11-Installer
          path: installer/TraderPlannerPro_Setup_v3.exe
