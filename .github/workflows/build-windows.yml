name: CI + Windows EXE + Installer
# Production verification: Quality -> Build EXE -> Installer -> Smoke Test -> Release

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  quality:
    # Whale Radar has a dedicated packaging workflow; never build TraderPlannerPro on that branch.
    if: github.ref != 'refs/heads/feature/whale-radar-1.5.0'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test/build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller pillow tzdata jdatetime hijridate pywebview pywinstyles matplotlib reportlab google-auth google-auth-oauthlib google-api-python-client openai-agents
      - name: Syntax check
        run: |
          python -m py_compile TraderPlannerPro_v7_0_3.py
          python -m py_compile TraderPlannerPro_v7.py
          python -m py_compile launcher.py
          python -m py_compile logo_3d.py
          python -m py_compile branding_assets.py
          python -m py_compile prepare_branding.py
          python -m py_compile academy_visuals.py
          python -m py_compile market_data.py
          python -m py_compile calendar_utils.py
          python -m py_compile ai_assistant.py
          python -m py_compile news_data.py
          python -m py_compile webview_runner.py
          python -m py_compile prepare_education_assets.py
          python -m py_compile glass_theme.py
          python -m py_compile academy_diagrams.py
          python -m py_compile google_oauth.py
          python -m py_compile statement_report.py
      - name: Run tests
        run: python -m pytest -q

  package:
    # Whale Radar has a dedicated packaging workflow; never build TraderPlannerPro on that branch.
    if: github.ref != 'refs/heads/feature/whale-radar-1.5.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Prepare exact education image assets
        run: python prepare_education_assets.py
      - name: Build Windows icon
        run: python build_icon.py
      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TraderPlannerPro
          --hidden-import tkinter
          --hidden-import tkinter.font
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.filedialog
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import json
          --hidden-import csv
          --hidden-import datetime
          --hidden-import pathlib
          --hidden-import shutil
          --hidden-import re
          --hidden-import uuid
          --collect-all tzdata
          --collect-all webview
          --collect-all agents
          --collect-all matplotlib
          --collect-all reportlab
          --hidden-import webview.platforms.edgechromium
          --hidden-import glass_theme
          --hidden-import academy_diagrams
          --hidden-import pywinstyles
          --hidden-import googleapiclient.discovery
          --hidden-import google_auth_oauthlib.flow
          --add-data "education_sources;education_sources"
          --add-data "trading_chart.html;."
          launcher.py
      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\TraderPlannerPro.exe'
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "EXE is unexpectedly small." }
      - name: Launch EXE smoke test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\TraderPlannerPro.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "TraderPlannerPro.exe exited during startup with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275 # v1.2.2
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer smoke test
        shell: powershell
        run: |
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $installer = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not produced." }
          $testRoot = Join-Path $env:TEMP 'TraderPlannerPro-CI-Test'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $installDir = Join-Path $testRoot 'App'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'TraderPlannerPro.exe'
          if (-not (Test-Path $installedExe)) { throw "Installed EXE not found." }
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed EXE exited during startup." }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found." }
          $un = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($un.ExitCode)" }
          if (Test-Path $installedExe) { throw "Installed EXE still exists after uninstall." }

      - name: Publish V9.0.0 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v9.0.0
          name: Trader Planner Pro V9.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ## Trader Planner Pro V9.0.0

            Trader Planner Pro V9.0.0 — integrated Trading Desk, Windows theme sync Windows Desktop Acrylic glass surface, synchronous Home navigation, persistent AI Command Center, flagship multi-agent routing, resilient no-key market feed fallbacks, and an Academy rebuilt around distinct SMC, ICT and candlestick visual semantics.

          files: |
            dist/TraderPlannerPro.exe
            installer/TraderPlannerPro_Setup_v9.0.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
