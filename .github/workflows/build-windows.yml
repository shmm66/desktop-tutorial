name: CI + Windows EXE + Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test/build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller reportlab openpyxl google-api-python-client google-auth google-auth-oauthlib tzdata
      - name: Syntax check
        run: |
          python -m py_compile TraderPlannerPro_v3.py
          python -m py_compile TraderPlannerPro_v4.py
          python -m py_compile TraderPlannerPro_v5.py
          python -m py_compile tests/test_smoke.py
      - name: Run tests
        run: python -m pytest -q

  package:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime/build dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab openpyxl google-api-python-client google-auth google-auth-oauthlib tzdata
      - name: Verify Tk submodules required by bundled V4
        shell: python
        run: |
          import tkinter
          import tkinter.font
          import tkinter.messagebox
          import tkinter.filedialog
          print('Tk imports OK')
      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TraderPlannerPro
          --add-data "TraderPlannerPro_v4.py;."
          --hidden-import tkinter
          --hidden-import tkinter.font
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.filedialog
          --hidden-import json
          --hidden-import csv
          --hidden-import webbrowser
          --hidden-import datetime
          TraderPlannerPro_v5.py
      - name: Launch EXE smoke test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\TraderPlannerPro.exe'
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | ForEach-Object { if ($_.Id -ne $p.Id) { Write-Host "Detected child app process $($_.Id)" } }
          if ($p.HasExited) {
            throw "TraderPlannerPro.exe exited during startup with code $($p.ExitCode)"
          }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host 'EXE startup smoke test passed.'
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer install-launch-uninstall smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $testRoot = Join-Path $env:TEMP 'TraderPlannerPro-CI-Test'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $installDir = Join-Path $testRoot 'App'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'TraderPlannerPro.exe'
          if (-not (Test-Path $installedExe)) { throw "Installed EXE not found: $installedExe" }
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed EXE exited during startup with code $($p.ExitCode)" }
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $un = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($un.ExitCode)" }
          Start-Sleep -Seconds 2
          Get-Process -Name TraderPlannerPro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path $installedExe) { throw 'Installed EXE still exists after uninstall.' }
          if (Test-Path $installDir) { Write-Host "Install directory remains; checking for files..."; Get-ChildItem $installDir -Force -ErrorAction SilentlyContinue }
          Write-Host 'Installer -> install -> launch -> uninstall -> verify passed.'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Verify installer artifact exists
        shell: powershell
        run: |
          $candidates = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $candidates) { Get-ChildItem -Recurse; throw 'Installer EXE was not produced.' }
          $candidates | Format-List FullName,Length
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TraderPlannerPro-Windows11-EXE
          path: dist/TraderPlannerPro.exe
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: TraderPlannerPro-Windows11-Installer
          path: '**/*Setup*.exe'
