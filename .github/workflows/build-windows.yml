name: CI + Windows EXE + Installer + V10
# Production verification: Quality -> Build EXE -> Installer -> Smoke Test -> Release

on:
  workflow_dispatch:
  push:
    branches: [ "v10-professional-visual-online" ]
permissions:
  contents: write

concurrency:
  group: trader-planner-v10-build
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate Python 3.14
        shell: powershell
        run: |
          $candidates = @()
          $candidates += Get-ChildItem 'C:\Program Files\Python*\python.exe' -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem 'C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem 'C:\Python*\python.exe' -ErrorAction SilentlyContinue
          $py = $candidates | Sort-Object FullName -Descending | Where-Object {
            try { (& $_.FullName --version 2>&1) -match 'Python 3\.14\.' } catch { $false }
          } | Select-Object -First 1
          if (-not $py) { throw 'Python 3.14.x was not found. Install Python 3.14 system-wide or make it visible to the runner service.' }
          "TP_PYTHON=$($py.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $py.FullName --version
          & $py.FullName -m pip --version
      - name: Install test/build dependencies
        shell: cmd
        run: |
          "%TP_PYTHON%" -m pip install --upgrade pip
          "%TP_PYTHON%" -m pip install pytest pyinstaller pillow tzdata jdatetime hijridate pywebview pywinstyles matplotlib reportlab google-auth google-auth-oauthlib google-api-python-client openai-agents
      - name: Syntax check
        shell: cmd
        run: |
          "%TP_PYTHON%" -m py_compile TraderPlannerPro_v7_0_3.py
          "%TP_PYTHON%" -m py_compile TraderPlannerPro_v7.py
          "%TP_PYTHON%" -m py_compile launcher.py
          "%TP_PYTHON%" -m py_compile logo_3d.py
          "%TP_PYTHON%" -m py_compile branding_assets.py
          "%TP_PYTHON%" -m py_compile prepare_branding.py
          "%TP_PYTHON%" -m py_compile academy_visuals.py
          "%TP_PYTHON%" -m py_compile market_data.py
          "%TP_PYTHON%" -m py_compile calendar_utils.py
          "%TP_PYTHON%" -m py_compile ai_assistant.py
          "%TP_PYTHON%" -m py_compile news_data.py
          "%TP_PYTHON%" -m py_compile webview_runner.py
          "%TP_PYTHON%" -m py_compile prepare_education_assets.py
          "%TP_PYTHON%" -m py_compile glass_theme.py
          "%TP_PYTHON%" -m py_compile academy_diagrams.py
          "%TP_PYTHON%" -m py_compile google_oauth.py
          "%TP_PYTHON%" -m py_compile statement_report.py
      - name: Run tests
        shell: cmd
        run: "%TP_PYTHON%" -m pytest -q

  package:
    needs: quality
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate Python 3.14
        shell: powershell
        run: |
          $candidates = @()
          $candidates += Get-ChildItem 'C:\Program Files\Python*\python.exe' -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem 'C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue
          $candidates += Get-ChildItem 'C:\Python*\python.exe' -ErrorAction SilentlyContinue
          $py = $candidates | Sort-Object FullName -Descending | Where-Object {
            try { (& $_.FullName --version 2>&1) -match 'Python 3\.14\.' } catch { $false }
          } | Select-Object -First 1
          if (-not $py) { throw 'Python 3.14.x was not found. Install Python 3.14 system-wide or make it visible to the runner service.' }
          "TP_PYTHON=$($py.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $py.FullName --version
          & $py.FullName -m pip --version
      - name: Install build dependencies
        shell: cmd
        run: |
          "%TP_PYTHON%" -m pip install --upgrade pip
          "%TP_PYTHON%" -m pip install -r requirements.txt pyinstaller
      - name: Prepare premium branding and exact education image assets
        shell: cmd
        run: "%TP_PYTHON%" prepare_branding.py
      - name: Prepare exact education image assets
        shell: cmd
        run: "%TP_PYTHON%" prepare_education_assets.py
      - name: Build Windows icon
        shell: cmd
        run: "%TP_PYTHON%" build_icon.py
      - name: Build EXE
        shell: cmd
        run: >-
          "%TP_PYTHON%" -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TraderPlannerPro
          --hidden-import tkinter
          --hidden-import tkinter.font
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.filedialog
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import json
          --hidden-import csv
          --hidden-import datetime
          --hidden-import pathlib
          --hidden-import shutil
          --hidden-import re
          --hidden-import uuid
          --collect-all tzdata
          --collect-all webview
          --collect-all agents
          --collect-all matplotlib
          --collect-all reportlab
          --hidden-import webview.platforms.edgechromium
          --hidden-import glass_theme
          --hidden-import academy_diagrams
          --hidden-import pywinstyles
          --hidden-import googleapiclient.discovery
          --hidden-import google_auth_oauthlib.flow
          --add-data "education_sources;education_sources"
          --add-data "trading_chart.html;."
          launcher.py
      - name: Verify EXE
        shell: cmd
        run: |
          if not exist "dist\TraderPlannerPro.exe" exit /b 1
          for %%A in ("dist\TraderPlannerPro.exe") do if %%~zA LSS 1000000 exit /b 1
      - name: Headless EXE self-test
        shell: cmd
        run: |
          "dist\TraderPlannerPro.exe" --self-test
          if errorlevel 1 exit /b 1
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275
        with:
          path: TraderPlannerPro.iss
          options: /O+
      - name: Installer smoke test
        shell: cmd
        run: |
          if not exist "installer\TraderPlannerPro_Setup_v10.0.0.exe" exit /b 1
          if exist "%TEMP%\TraderPlannerPro-CI-Test" rmdir /s /q "%TEMP%\TraderPlannerPro-CI-Test"
          mkdir "%TEMP%\TraderPlannerPro-CI-Test\App"
          "installer\TraderPlannerPro_Setup_v10.0.0.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="%TEMP%\TraderPlannerPro-CI-Test\App"
          if errorlevel 1 exit /b 1
          if not exist "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe" exit /b 1
          "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe" --self-test
          if errorlevel 1 exit /b 1
          if not exist "%TEMP%\TraderPlannerPro-CI-Test\App\unins000.exe" exit /b 1
          "%TEMP%\TraderPlannerPro-CI-Test\App\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if errorlevel 1 exit /b 1
          if exist "%TEMP%\TraderPlannerPro-CI-Test\App\TraderPlannerPro.exe" exit /b 1

      - name: Publish V10.0.0 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v10-professional-visual-online')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v10.0.0
          name: Trader Planner Pro V10.0.0 — Verified Windows Build
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ## Trader Planner Pro V10.0.0

            Verified GitHub-hosted Windows x64 build of Trader Planner Pro V10.0.0. Includes the premium native glass workspace, live Trading Desk, multi-market chart universe, AI Command Center, Academy taxonomy and branded installer.

          files: |
            dist/TraderPlannerPro.exe
            installer/TraderPlannerPro_Setup_v10.0.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}