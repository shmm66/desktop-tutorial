name: CI + Windows EXE + Installer
# V10.0.0 production build

on:
  workflow_dispatch:
  push:
    branches: [ "v10-professional-visual-online", main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  checks: write

jobs:
  package:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap system Python 3.14 and isolated venv
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $systemPython = 'C:/Program Files/Python314/python.exe'
          if (-not (Test-Path $systemPython)) { throw "System Python 3.14 not found: $systemPython" }
          & $systemPython --version
          $pythonDir = Join-Path $env:GITHUB_WORKSPACE '.python314'
          if (Test-Path $pythonDir) { Remove-Item $pythonDir -Recurse -Force -ErrorAction SilentlyContinue }
          & $systemPython -m venv --system-site-packages $pythonDir
          if ($LASTEXITCODE -ne 0) { throw "Failed to create isolated venv. Exit code $LASTEXITCODE" }
          $py = Join-Path $pythonDir 'Scripts/python.exe'
          if (-not (Test-Path $py)) { throw "Venv Python executable not found: $py" }
          & $py --version
          & $py -m pip --version
          "TP_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build dependencies
        shell: powershell
        env:
          PIP_DEFAULT_TIMEOUT: '180'
          PIP_RETRIES: '20'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TP_PYTHON -m pip install --upgrade pip --prefer-binary --default-timeout 180 --retries 20 --no-input
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed with exit code $LASTEXITCODE" }

          function Install-ReliablePackage([string]$Spec) {
            # Use the current CPython 3.14-compatible Matplotlib wheel explicitly.
            # This avoids resolver/index ambiguity seen in the previous runner attempt.
            if ($Spec -eq 'matplotlib>=3.9,<4') { $Spec = 'matplotlib==3.11.2' }

            $installed = $false
            foreach ($attempt in 1..3) {
              Write-Host "Installing $Spec (attempt $attempt/3)"
              $pipArgs = @('-m','pip','install','--prefer-binary','--default-timeout','180','--retries','20','--no-input')
              if ($attempt -gt 1) { $pipArgs += '--no-cache-dir' }
              $pipArgs += $Spec
              & $env:TP_PYTHON @pipArgs
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Write-Warning "Install failed for $Spec on attempt $attempt."
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $installed) { throw "Dependency install failed after retries: $Spec" }
          }

          $requirements = Get-Content -Path 'requirements.txt' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }

          foreach ($spec in $requirements) {
            Install-ReliablePackage $spec
          }

          & $env:TP_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip dependency consistency check failed." }

          & $env:TP_PYTHON -c "import PyInstaller; print(PyInstaller.__version__)" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Install-ReliablePackage 'pyinstaller==6.22.3'
          }

      - name: Syntax check
        shell: powershell
        run: |
          $files = @('TraderPlannerPro_v7_0_3.py','TraderPlannerPro_v7.py','launcher.py','logo_3d.py','branding_assets.py','prepare_branding.py','academy_visuals.py','market_data.py','calendar_utils.py','ai_assistant.py','news_data.py','webview_runner.py','prepare_education_assets.py','glass_theme.py','academy_diagrams.py','google_oauth.py','statement_report.py','tradingview_runner.py')
          foreach ($file in $files) { & $env:TP_PYTHON -m py_compile $file }

      - name: Run tests and preserve report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & $env:TP_PYTHON -m pytest -q --tb=long 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Set-Content -Path pytest-report.txt -Encoding utf8
          "pytest_exit_code=$code" | Add-Content -Path pytest-report.txt -Encoding utf8
          Get-Content pytest-report.txt
          "TP_PYTEST_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Publish pytest diagnostic check
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $report = if (Test-Path pytest-report.txt) { Get-Content pytest-report.txt -Raw } else { 'pytest-report.txt was not created.' }
          $summary = $report
          if ($summary.Length -gt 60000) { $summary = $summary.Substring($summary.Length - 60000) }
          $conclusion = if ([int]$env:TP_PYTEST_EXIT -eq 0) { 'success' } else { 'failure' }
          $payload = @{
            name = 'pytest-diagnostics'
            head_sha = $env:GITHUB_SHA
            status = 'completed'
            conclusion = $conclusion
            output = @{
              title = "pytest result: $conclusion"
              summary = $summary
              text = "Run: $env:GITHUB_RUN_ID`nCommit: $env:GITHUB_SHA"
            }
          } | ConvertTo-Json -Depth 8
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/check-runs" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" } `
            -ContentType "application/json" `
            -Body $payload | Out-Null

      - name: Enforce pytest result
        shell: powershell
        run: |
          if ([int]$env:TP_PYTEST_EXIT -ne 0) { throw "pytest failed with exit code $env:TP_PYTEST_EXIT; see pytest-report artifact" }

      - name: Prepare exact education image assets
        shell: powershell
        run: |
          & $env:TP_PYTHON prepare_education_assets.py

      - name: Build Windows icon
        shell: powershell
        run: |
          & $env:TP_PYTHON build_icon.py

      - name: Build EXE
        shell: powershell
        run: >-
          & $env:TP_PYTHON -m PyInstaller --noconfirm --clean --onefile --windowed --name TraderPlannerPro --hidden-import tkinter --hidden-import tkinter.font --hidden-import tkinter.messagebox --hidden-import tkinter.filedialog --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --hidden-import json --hidden-import csv --hidden-import datetime --hidden-import pathlib --hidden-import shutil --hidden-import re --hidden-import uuid --collect-all tzdata --collect-all webview --collect-all agents --collect-all matplotlib --collect-all reportlab --hidden-import webview.platforms.edgechromium --hidden-import glass_theme --hidden-import academy_diagrams --hidden-import native_trading_desk --hidden-import tradingview_runner --hidden-import pywinstyles --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow --add-data 'education_sources;education_sources' launcher.py

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist/TraderPlannerPro.exe'
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small.' }
          Write-Host "EXE ready: $exe"

      - name: EXE self-test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist/TraderPlannerPro.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed with exit code $($p.ExitCode)" }

      - name: Install official Inno Setup 7.1.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $url = 'https://files.jrsoftware.org/is/7/innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $sig = Get-AuthenticodeSignature -FilePath $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw "Inno Setup signature verification failed: $($sig.Status) / $($sig.SignerCertificate.Subject)" }
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($p.ExitCode)" }
          $candidates = @('C:/Program Files/Inno Setup 7/ISCC.exe','C:/Program Files (x86)/Inno Setup 7/ISCC.exe','C:/Program Files/Inno Setup 6/ISCC.exe','C:/Program Files (x86)/Inno Setup 6/ISCC.exe')
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after Inno Setup installation.' }
          "TP_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $iscc /?

      - name: Build installer
        shell: powershell
        run: |
          & $env:TP_ISCC '/O+','TraderPlannerPro.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }

      - name: Verify installer output
        shell: powershell
        run: |
          $installer = Get-ChildItem -Recurse -File -Filter '*Setup*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          Write-Host "Installer ready: $($installer.FullName)"

      - name: Write build manifest
        shell: powershell
        run: |
          $manifest = @()
          $manifest += "Trader Planner Pro V10"
          $manifest += "Commit: $env:GITHUB_SHA"
          $manifest += "Ref: $env:GITHUB_REF"
          $manifest += "Run: $env:GITHUB_RUN_ID"
          $manifest += "Runner: $env:RUNNER_NAME"
          $manifest += "Timestamp UTC: $([DateTime]::UtcNow.ToString('o'))"
          $manifest | Out-File -FilePath "build-manifest.txt" -Encoding utf8

      - name: Upload verified build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: TraderPlannerPro-V10-TradingView-Pro-Windows-Verified
          path: |
            dist/TraderPlannerPro.exe
            **/*Setup*.exe
            build-manifest.txt
          if-no-files-found: error
