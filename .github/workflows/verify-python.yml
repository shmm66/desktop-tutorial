name: Python Verification (cross-platform)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest pillow tzdata jdatetime hijridate reportlab google-auth google-auth-oauthlib google-api-python-client openai-agents
      - name: Syntax check
        run: |
          python -m py_compile TraderPlannerPro_v7_0_3.py
          python -m py_compile launcher.py
          python -m py_compile academy_visuals.py
          python -m py_compile academy_diagrams.py
          python -m py_compile market_data.py
          python -m py_compile calendar_utils.py
          python -m py_compile ai_assistant.py
          python -m py_compile news_data.py
          python -m py_compile google_oauth.py
          python -m py_compile statement_report.py
          python -m py_compile glass_theme.py
      - name: Run tests
        run: python -m pytest -q
