name: V8.2.0 Bootstrap Diagnostics

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record checkout
        shell: powershell
        run: |
          'checkout-ok' | Out-File bootstrap-marker.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap-marker.txt
          git commit -m 'ci: checkout checkpoint [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Python setup
        shell: powershell
        run: |
          python --version | Out-File bootstrap-python.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap-python.txt
          git commit -m 'ci: python checkpoint [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
      - name: Print pip
        run: python -m pip --version