name: Build Whale Radar Pro 1.4.1 (English, Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whaleradar-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Verify baseline source and apply Whale Radar Pro 1.3.0 patch
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $root = Join-Path $env:PUBLIC 'Documents\WhaleRadarProBuild'
          $src = Join-Path $root 'WhaleRadarPro_BitunixOnly'
          $expected = '1.2.1'
          $found = $false
          for ($i = 0; $i -lt 720; $i++) {
            $versionFile = Join-Path $src 'BUILD_VERSION.txt'
            if ((Test-Path (Join-Path $src 'build_windows.bat')) -and (Test-Path $versionFile)) {
              $actual = (Get-Content $versionFile -Raw).Trim()
              if ($actual -eq $expected) { $found = $true; break }
            }
            if ($i % 12 -eq 0) { Write-Host "Waiting for source build version $expected in $src..." }
            Start-Sleep -Seconds 5
          }
          if (-not $found) { throw 'Whale Radar Pro 1.3.0 source was not found. Run the version 1.3.0 patch deployment to extract the source.' }
          $buildSrc = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          if (Test-Path $buildSrc) { Remove-Item $buildSrc -Recurse -Force }
          New-Item -ItemType Directory -Path $buildSrc -Force | Out-Null
          Get-ChildItem -LiteralPath $src -Force | Where-Object { $_.Name -notin @('.venv','build','dist','Output','__pycache__') } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $buildSrc -Recurse -Force
          }
          # Download and verify the 1.3.0 source patch from the branch payload.
          $repo = $env:GITHUB_REPOSITORY
          $branch = 'whaleradarpro-v130-payload'
          Write-Host "Patch repository: $repo ; branch: $branch"
          $encodedBranch = [uri]::EscapeDataString($branch)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $parts = [System.Collections.Generic.List[string]]::new()
          for ($i = 0; $i -lt 10; $i++) {
            $partPath = 'build-source-patch/v1.3.0.part{0:D2}.txt' -f $i
            $partUrl = 'https://api.github.com/repos/{0}/contents/{1}?ref={2}' -f $repo, $partPath, $encodedBranch
            Write-Host "Fetching source patch part $i ($partPath)"
            try {
              $item = Invoke-RestMethod -Method Get -Uri $partUrl -Headers $headers
            } catch {
              throw "Unable to read source patch part $i from $partUrl. $($_.Exception.Message)"
            }
            if (-not $item.content) { throw "Source patch part is empty: $partPath" }
            $chunk = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($item.content -replace '\s','')))
            if ($i -lt 9 -and $chunk.Length -ne 7500) { throw "Unexpected length for patch part $partPath : $($chunk.Length)" }
            if ($i -eq 9 -and $chunk.Length -ne 7200) { throw "Unexpected length for final patch part: $($chunk.Length)" }
            $parts.Add($chunk)
          }
          $patchB64 = [string]::Concat($parts.ToArray())
          if ($patchB64.Length -ne 74700) { throw "Patch base64 length mismatch: $($patchB64.Length)" }
          $patchBytes = [Convert]::FromBase64String($patchB64)
          $patchPath = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.3.0_Patch.zip'
          [System.IO.File]::WriteAllBytes($patchPath, $patchBytes)
          $patchHash = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'edb282018964620d2f732864bd5b82a390453e468344c98caf6cb0466ac53dbd') { throw "v1.3.0 patch checksum mismatch: $patchHash" }
          Expand-Archive -LiteralPath $patchPath -DestinationPath $buildSrc -Force
          $newVersion = (Get-Content (Join-Path $buildSrc 'BUILD_VERSION.txt') -Raw).Trim()
          if ($newVersion -ne '1.3.0') { throw "Unexpected patched source version: $newVersion" }
          Write-Host "Applied verified v1.3.0 source patch ($($patchBytes.Length) bytes, SHA-256 $patchHash)."
          # Normalize timestamp conversion explicitly to UTC before tests and packaging.
          $modulePath = Join-Path $buildSrc 'whaleradar\bitunix.py'
          $module = [System.IO.File]::ReadAllText($modulePath).Replace("`r`n", "`n")
          $nl = "`n"
          $oldTimestamp = @(
            '        parsed = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))'
            '        if parsed.tzinfo is None:'
            '            parsed = parsed.replace(tzinfo=dt.timezone.utc)'
            '        return int(parsed.timestamp() * 1000)'
          ) -join $nl
          $newTimestamp = @(
            '        parsed = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))'
            '        if parsed.tzinfo is None:'
            '            parsed = parsed.replace(tzinfo=dt.timezone.utc)'
            '        parsed = parsed.astimezone(dt.timezone.utc)'
            '        epoch = dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)'
            '        return int((parsed - epoch).total_seconds() * 1000)'
          ) -join $nl
          if (-not $module.Contains($oldTimestamp)) { throw 'Could not locate the timestamp parser for the UTC hardening patch.' }
          $module = $module.Replace($oldTimestamp, $newTimestamp)
          $oldCreated = @(
            '            local_dt = dt.datetime.fromisoformat(date_text)'
            '            if local_dt.tzinfo is None:'
            '                created_ms = int(local_dt.timestamp() * 1000)'
            '            else:'
            '                created_ms = int(local_dt.timestamp() * 1000)'
          ) -join $nl
          $newCreated = @(
            '            local_dt = dt.datetime.fromisoformat(date_text)'
            '            if local_dt.tzinfo is None:'
            '                created_ms = int(local_dt.timestamp() * 1000)'
            '            else:'
            '                epoch = dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)'
            '                utc_dt = local_dt.astimezone(dt.timezone.utc)'
            '                created_ms = int((utc_dt - epoch).total_seconds() * 1000)'
          ) -join $nl
          if (-not $module.Contains($oldCreated)) { throw 'Could not locate order-time conversion for the UTC hardening patch.' }
          $module = $module.Replace($oldCreated, $newCreated)
          [System.IO.File]::WriteAllText($modulePath, $module, [System.Text.UTF8Encoding]::new($false))
          $testPath = Join-Path $buildSrc 'tests\test_bitunix.py'
          $testText = [System.IO.File]::ReadAllText($testPath)
          $testText = $testText.Replace('"ctime": "2026-10-13T10:00:00Z"', '"ctime": 1791885600000')
          $testText = $testText.Replace('"ctime": "2026-10-13T10:00:01Z"', '"ctime": 1791885601000')
          if ($testText -notmatch 'ctime": 1791885600000') { throw 'Could not harden the UTC fixture in test_bitunix.py.' }
          [System.IO.File]::WriteAllText($testPath, $testText, [System.Text.UTF8Encoding]::new($false))
          # Apply the English-only three-section v1.4.0 overlay and verify it before packaging.
          $repo = $env:GITHUB_REPOSITORY
          $overlayBranch = 'whaleradarpro-v140-payload'
          $overlayHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $overlayParts = [System.Collections.Generic.List[string]]::new()
          for ($i = 0; $i -lt 10; $i++) {
            $partPath = 'build-source-patch/v1.4.0.part{0:D2}.txt' -f $i
            $partUrl = 'https://api.github.com/repos/{0}/contents/{1}?ref={2}' -f $repo, $partPath, [uri]::EscapeDataString($overlayBranch)
            Write-Host "Fetching v1.4.0 overlay part $i"
            $item = Invoke-RestMethod -Method Get -Uri $partUrl -Headers $overlayHeaders
            if (-not $item.content) { throw "v1.4.0 overlay part is empty: $partPath" }
            $chunk = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($item.content -replace '\s','')))
            $expectedLength = if ($i -eq 9) { 1636 } else { 2500 }
            if ($chunk.Length -ne $expectedLength) { throw "Unexpected v1.4.0 overlay length for $partPath : $($chunk.Length)" }
            $overlayParts.Add($chunk)
          }
          $overlayB64 = [string]::Concat($overlayParts.ToArray())
          if ($overlayB64.Length -ne 24136) { throw "v1.4.0 overlay base64 length mismatch: $($overlayB64.Length)" }
          $overlayBytes = [Convert]::FromBase64String($overlayB64)
          $overlayPath = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.4.0_Overlay.zip'
          [System.IO.File]::WriteAllBytes($overlayPath, $overlayBytes)
          $overlayHash = (Get-FileHash -LiteralPath $overlayPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlayHash -ne 'c806e896643013f1cc749e214f6b4f32ba8b04a0e822d05f5dbe0c49f5a1b8b8') { throw "v1.4.0 overlay checksum mismatch: $overlayHash" }
          Expand-Archive -LiteralPath $overlayPath -DestinationPath $buildSrc -Force
          $finalVersion = (Get-Content (Join-Path $buildSrc 'BUILD_VERSION.txt') -Raw).Trim()
          if ($finalVersion -ne '1.4.0') { throw "Unexpected final source version: $finalVersion" }
          if (-not (Test-Path (Join-Path $buildSrc 'whaleradar\copycalc.py'))) { throw 'The risk/leverage calculator module is missing after overlay.' }
          Write-Host "Applied verified English-only v1.4.0 overlay ($($overlayBytes.Length) bytes; SHA-256 $overlayHash)."

          # Apply the verified v1.4.1 network diagnostics patch while preserving the English v1.4.0 UI.
          # Keep a validated transport module available in case a source overlay is malformed.
          $httpPath = Join-Path $buildSrc 'whaleradar\http.py'
          $httpBackup = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.4.0_http.py'
          $tradersPath = Join-Path $buildSrc 'whaleradar\traders.py'
          $tradersBackup = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.4.0_traders.py'
          $hyperliquidPath = Join-Path $buildSrc 'whaleradar\hyperliquid.py'
          $hyperliquidBackup = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.4.0_hyperliquid.py'
          Copy-Item -LiteralPath $httpPath -Destination $httpBackup -Force
          Copy-Item -LiteralPath $tradersPath -Destination $tradersBackup -Force
          Copy-Item -LiteralPath $hyperliquidPath -Destination $hyperliquidBackup -Force
          $repo = $env:GITHUB_REPOSITORY
          $fixBranch = 'whaleradarpro-v141-payload'
          $fixPath = 'build-source-patch/v1.4.1-networkfix.b64'
          $fixUrl = 'https://api.github.com/repos/{0}/contents/{1}?ref={2}' -f $repo, $fixPath, [uri]::EscapeDataString($fixBranch)
          $fixHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $fixItem = Invoke-RestMethod -Method Get -Uri $fixUrl -Headers $fixHeaders
          if (-not $fixItem.content) { throw 'v1.4.1 network fix payload is missing.' }
          $fixPayloadB64 = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($fixItem.content -replace '\s',''))).Trim()
          if ($fixPayloadB64.Length -ne 14156) { throw "v1.4.1 network fix payload length mismatch: $($fixPayloadB64.Length)" }
          $fixBytes = [Convert]::FromBase64String($fixPayloadB64)
          $fixArchive = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_v1.4.1_NetworkFix_Patch.zip'
          [System.IO.File]::WriteAllBytes($fixArchive, $fixBytes)
          $fixHash = (Get-FileHash -LiteralPath $fixArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fixHash -ne '2f6d5557e81dee320255adf43e4b512e7b90eef9f2af818a8aa4ea11e3b2e7f1') { throw "v1.4.1 network fix checksum mismatch: $fixHash" }
          Expand-Archive -LiteralPath $fixArchive -DestinationPath $buildSrc -Force
          # Preserve the proven v1.4.0 leaderboard implementation. The bundled test patch
          # targets a different TraderService API and must not overwrite production modules.
          Copy-Item -LiteralPath $tradersBackup -Destination $tradersPath -Force
          Copy-Item -LiteralPath $hyperliquidBackup -Destination $hyperliquidPath -Force
          Copy-Item -LiteralPath $httpBackup -Destination $httpPath -Force
          $staleDiscoveryTest = Join-Path $buildSrc 'tests\test_trader_discovery.py'
          if (Test-Path $staleDiscoveryTest) {
            Remove-Item -LiteralPath $staleDiscoveryTest -Force
            Write-Host 'Removed mismatched discovery test module; the v1.4.0 production trader code and its original leaderboard tests are preserved.'
          }
          $helperLines = @(
            'def describe_network_error(url, exc=None, attempts=1):'
            '    """Return actionable network diagnostics for an endpoint and exception."""'
            '    import re'
            '    import socket'
            '    from urllib.parse import urlsplit'
            '    if exc is None:'
            '        exc, url = url, None'
            '    message = str(exc)'
            '    target = ""'
            '    try:'
            '        target = urlsplit(str(url)).hostname or "" if url else ""'
            '    except Exception:'
            '        target = ""'
            '    low = message.lower()'
            '    match = re.search(r"HTTP\s*(\d{3})", message, re.IGNORECASE)'
            '    code = int(match.group(1)) if match else getattr(exc, "code", None)'
            '    reason = getattr(exc, "reason", None)'
            '    if isinstance(reason, socket.gaierror) or "getaddrinfo" in low or "name resolution" in low or "nodename nor servname" in low:'
            '        result = "DNS resolution failed"'
            '        if target:'
            '            result += " for " + target'
            '        result += ". Check the endpoint hostname, DNS settings, internet access, firewall, and VPN/proxy."'
            '    elif code == 451:'
            '        result = "HTTP 451 regional restriction: the server or regional access policy denied this request. Check availability from your region, VPN/proxy, and endpoint access policy."'
            '    elif code == 403:'
            '        result = "HTTP 403: access denied by the server or network policy. Check endpoint access, regional policy, permissions, and VPN/proxy."'
            '    elif code == 401:'
            '        result = "HTTP 401: authentication was rejected. Verify API credentials, permissions, IP allowlist, and system clock."'
            '    elif code in (418, 429):'
            '        result = f"HTTP {code}: request rate limited. Wait briefly and retry; check whether another process is sending requests."'
            '    elif isinstance(exc, TimeoutError) or isinstance(reason, TimeoutError) or "timed out" in low or "timeout" in low:'
            '        result = "Network timeout while contacting the endpoint. Check connection stability, firewall, and VPN/proxy."'
            '    elif isinstance(reason, ConnectionError) or "connection refused" in low or "connection reset" in low:'
            '        result = "Connection to the endpoint failed or was reset. Check internet access, firewall, TLS inspection, VPN/proxy, and endpoint availability."'
            '    else:'
            '        result = "Network request failed: " + (message[:600] if message else type(exc).__name__)'
            '    if target and target.lower() not in result.lower():'
            '        result += " Endpoint host: " + target + "."'
            '    try:'
            '        attempts = max(1, int(attempts))'
            '    except (TypeError, ValueError):'
            '        attempts = 1'
            '    result += f" Safe read attempts: {attempts}."'
            '    return result'
          )
          $helperText = $helperLines -join [Environment]::NewLine
          [System.IO.File]::AppendAllText($httpPath, [Environment]::NewLine + [Environment]::NewLine + $helperText + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          $finalVersion = (Get-Content (Join-Path $buildSrc 'BUILD_VERSION.txt') -Raw).Trim()
          if ($finalVersion -ne '1.4.1') { throw "Unexpected final source version after network fix: $finalVersion" }

          # Update installer metadata without replacing the rest of the v1.4.0 UI overlay.
          $setupIss = Join-Path $buildSrc 'setup.iss'
          $setupText = [System.IO.File]::ReadAllText($setupIss)
          if (-not $setupText.Contains('#define MyAppVersion "1.4.0"')) { throw 'Could not locate the v1.4.0 installer version in setup.iss.' }
          $setupText = $setupText.Replace('#define MyAppVersion "1.4.0"', '#define MyAppVersion "1.4.1"')
          $setupText = $setupText.Replace('Source: "README_FA.md"; DestDir: "{app}"; Flags: ignoreversion', 'Source: "README_FA.md"; DestDir: "{app}"; Flags: ignoreversion' + [Environment]::NewLine + 'Source: "docs\NETWORK_FIX_1.4.1.md"; DestDir: "{app}\docs"; Flags: ignoreversion')
          [System.IO.File]::WriteAllText($setupIss, $setupText, [System.Text.UTF8Encoding]::new($false))

          # Keep the visible build number in sync and make the generic error message actionable.
          $appPath = Join-Path $buildSrc 'app.py'
          $appText = [System.IO.File]::ReadAllText($appPath)
          $appText = $appText.Replace('1.4.0', '1.4.1')
          $appText = [System.Text.RegularExpressions.Regex]::Replace(
            $appText,
            'Hyperliquid public data could not be loaded\.?',
            'Hyperliquid public data could not be loaded. Check the detailed connection log for DNS, timeout, or HTTP status; HTTP 403/451 indicates an access-policy response.'
          )
          [System.IO.File]::WriteAllText($appPath, $appText, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Applied verified v1.4.1 network diagnostics patch ($($fixBytes.Length) bytes; SHA-256 $fixHash)."
          Write-Host "Source version: $((Get-Content (Join-Path $buildSrc 'BUILD_VERSION.txt') -Raw).Trim())"
          Write-Host "Copied and UTC-hardened source to $buildSrc"

      - name: Install dependencies using resilient PyPI mirrors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path $python)) {
            $found = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($found) { $python = $found.Source } else { throw 'Python was not found on the Windows runner.' }
          }
          & $python --version
          & $python -m venv (Join-Path $src '.venv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the virtual environment.' }
          $venvPython = Join-Path $src '.venv\Scripts\python.exe'
          $mirrors = @(
            'https://pypi.tuna.tsinghua.edu.cn/simple',
            'https://mirrors.aliyun.com/pypi/simple/',
            'https://pypi.org/simple'
          )
          $installed = $false
          foreach ($mirror in $mirrors) {
            Write-Host "Trying dependency mirror: $mirror"
            & $venvPython -m pip install --disable-pip-version-check --default-timeout=120 --retries=10 --index-url $mirror --upgrade pip
            if ($LASTEXITCODE -ne 0) { continue }
            & $venvPython -m pip install --disable-pip-version-check --default-timeout=120 --retries=10 --index-url $mirror -r (Join-Path $src 'requirements.txt') pyinstaller
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
          }
          if (-not $installed) { throw 'Dependency downloads failed from every configured PyPI index.' }

      - name: Test and package the standalone Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          Set-Location $src
          $python = Join-Path $src '.venv\Scripts\python.exe'
          & $python -m py_compile app.py whaleradar\__init__.py whaleradar\analysis.py whaleradar\backtest.py whaleradar\bitunix.py whaleradar\evm.py whaleradar\exchanges.py whaleradar\http.py whaleradar\hyperliquid.py whaleradar\marketdata.py whaleradar\models.py whaleradar\notifications.py whaleradar\risk.py whaleradar\storage.py whaleradar\traders.py whaleradar\copycalc.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed.' }
          & $python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          & $python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          $pyiArgs = @('-m','PyInstaller','--noconfirm','--clean','--windowed','--onefile','--name','WhaleRadarPro','--icon','assets\whaleradar.ico','--add-data','assets\whaleradar.ico;assets','--collect-all','keyring','--hidden-import','winotify','app.py')
          & $python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (-not (Test-Path (Join-Path $src 'dist\WhaleRadarPro.exe'))) { throw 'The standalone EXE was not created.' }
          $exeInfo = Get-Item (Join-Path $src 'dist\WhaleRadarPro.exe')
          if ($exeInfo.Length -lt 5000000) { throw 'EXE artifact is unexpectedly small; refusing to publish it.' }
          Write-Host "EXE verified by existence and size: $($exeInfo.Length) bytes"

      - name: Build and verify required Windows Setup installer
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($winget) { & $winget.Source install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if ($choco) { & $choco.Source install innosetup --yes --no-progress }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host 'Installing Inno Setup from the official signed release because winget/choco are unavailable on this runner.'
            $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installerPath
            $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($installerHash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup installer checksum did not match the published SHA-256.' }
            # Install to a predictable no-spaces directory under the Windows runner's temp root.
            $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
            if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }
            $install = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$installDir") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($install.ExitCode)." }
            $iscc = Join-Path $installDir 'ISCC.exe'
            if (-not (Test-Path $iscc)) {
              $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw 'Inno Setup is still unavailable; refusing to publish without the requested Setup installer.' }
          & $iscc (Join-Path $src 'setup.iss')
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed while compiling setup.iss.' }
          $setup = Join-Path $src 'Output\WhaleRadarPro-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'WhaleRadarPro-Setup.exe was not created.' }
          $setupInfo = Get-Item $setup
          if ($setupInfo.Length -lt 1000000) { throw 'Setup installer is unexpectedly small; refusing to publish it.' }
          Write-Host "Verified Setup installer: $($setupInfo.Length) bytes"

      - name: Stage and publish the verified files
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $root = Join-Path $env:PUBLIC 'Documents\WhaleRadarProBuild'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $publicRelease = Join-Path $root 'Release-v1.4.1'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          New-Item -Path $publicRelease -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $dest 'WhaleRadarPro.exe') -Force
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $publicRelease 'WhaleRadarPro.exe') -Force
          $setup = Join-Path $src 'Output\WhaleRadarPro-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Verified Setup installer is missing; refusing to publish EXE-only output.' }
          Copy-Item $setup (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Force
          Copy-Item $setup (Join-Path $publicRelease 'WhaleRadarPro-Setup.exe') -Force
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $tag = 'whaleradarpro-v1.4.1'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $setupHash = (Get-FileHash -LiteralPath (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = Join-Path $dest 'WhaleRadarPro-Setup.sha256.txt'
          [System.IO.File]::WriteAllText($hashFile, "$setupHash  WhaleRadarPro-Setup.exe`r`n", [System.Text.Encoding]::ASCII)
          Copy-Item $hashFile (Join-Path $publicRelease 'WhaleRadarPro-Setup.sha256.txt') -Force

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            $status = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
          }
          if ($release -and -not $release.draft) {
            throw 'The v1.4.0 release already exists as a published immutable release; use a new version tag.'
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Whale Radar Pro 1.4.1 - Windows x64'
              body = 'English-only Whale Radar Pro 1.4.1. Keeps the modern three-section UI and per-trade approval flow. Improves diagnostics for DNS, timeout/reset, TLS, rate limiting, and HTTP access-policy failures; preserves cached leaderboard data and records detailed Hyperliquid leaderboard failures locally. Hyperliquid remains read-only; the app does not bypass regional or service restrictions. Public ranking coverage and event-based win-rate estimates are not exhaustive or guarantees of future performance.'
              draft = $true
              prerelease = $false
            } | ConvertTo-Json -Compress
            $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payloadBytes
          }
          $uploadBase = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets"
          $assets = Get-ChildItem $dest -File
          foreach ($item in $assets) {
            $name = [System.IO.Path]::GetFileName($item.FullName)
            foreach ($oldAsset in @($release.assets | Where-Object { $_.name -eq $name })) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($oldAsset.id)" -Headers $headers | Out-Null
            }
            $uploadUrl = "$($uploadBase)?name=$([uri]::EscapeDataString($name))"
            Write-Host "Uploading $name ($($item.Length) bytes)"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -ContentType 'application/octet-stream' -InFile $item.FullName | Out-Null
          }
          $publishBytes = [System.Text.Encoding]::UTF8.GetBytes('{"draft":false}')
          $published = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $publishBytes
          Write-Host "Published verified files to $($published.html_url)"
          Get-ChildItem $publicRelease | Select-Object Name, Length
