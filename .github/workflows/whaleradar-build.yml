name: Build Whale Radar Pro 1.5.0 (English, Windows)

on:
  push:
    branches: [main, "feature/whale-radar-1.5.0"]
    paths:
      - '.github/workflows/whaleradar-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The reviewed 1.5.0 source payload lives on its own branch so the build
  # always consumes one verified archive instead of a chain of patch stages.
  PAYLOAD_BRANCH: whaleradarpro-v150-payload
  PAYLOAD_SHA256: 58a9d8e8cdfd1adf6bc00f73e0fbb41132cdd0174a462d9b45c1b6e892cef85e
  SOURCE_VERSION: 1.5.0
  RELEASE_TAG: whaleradarpro-v1.5.0

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the reviewed Whale Radar Pro 1.5.0 source
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:PUBLIC 'Documents\WhaleRadarProBuild'
          $baseline = Join-Path $root 'WhaleRadarPro_BitunixOnly'
          $buildSrc = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'

          # The runner keeps the baseline source tree locally. Wait a bounded time
          # for it, then fail with an actionable message instead of building from
          # an incomplete tree. The baseline version is pinned because the
          # reviewed payload is written against it.
          $expectedBaseline = '1.2.1'
          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            $versionFile = Join-Path $baseline 'BUILD_VERSION.txt'
            if ((Test-Path (Join-Path $baseline 'build_windows.bat')) -and
                (Test-Path (Join-Path $baseline 'whaleradar\storage.py')) -and
                (Test-Path (Join-Path $baseline 'whaleradar\http.py')) -and
                (Test-Path $versionFile)) {
              $actual = (Get-Content $versionFile -Raw).Trim()
              if ($actual -eq $expectedBaseline) {
                $found = $true
                break
              }
              Write-Host "Baseline source is version '$actual'; waiting for '$expectedBaseline'."
            } else {
              Write-Host "Baseline source is not present yet at $baseline; waiting."
            }
            Start-Sleep -Seconds 30
          }
          if (-not $found) {
            throw "The Whale Radar Pro baseline source '$expectedBaseline' was not found at '$baseline'. Restore the runner source tree and re-run the build."
          }

          if (Test-Path $buildSrc) { Remove-Item -LiteralPath $buildSrc -Recurse -Force }
          New-Item -ItemType Directory -Path $buildSrc -Force | Out-Null
          # Copy the baseline contents, excluding a stale virtual environment and
          # previous build output. A copied .venv would carry the old absolute
          # paths and break the environment created further down.
          Get-ChildItem -LiteralPath $baseline -Force |
            Where-Object { $_.Name -notin @('.venv','build','dist','Output','__pycache__') } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $buildSrc -Recurse -Force }
          Write-Host "Baseline source copied to $buildSrc"

          # Keep the previous transport module next to the reviewed one. The new
          # whaleradar/http.py forwards any unknown attribute to it, so a helper
          # the baseline provided stays importable after the replacement.
          $baselineHttp = Join-Path $buildSrc 'whaleradar\http.py'
          $legacyHttp = Join-Path $buildSrc 'whaleradar\_http_legacy.py'
          if ((Test-Path $baselineHttp) -and -not (Test-Path $legacyHttp)) {
            Copy-Item -LiteralPath $baselineHttp -Destination $legacyHttp -Force
            Write-Host 'Previous transport module preserved as whaleradar\_http_legacy.py.'
          }

          # Download the reviewed source payload from the payload branch.
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $manifestItem = Invoke-RestMethod -Uri "$api/contents/build-source-patch/v1.5.0.manifest.json`?ref=$env:PAYLOAD_BRANCH" -Headers $headers
          $manifestText = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($manifestItem.content -replace '\s','')))
          $manifest = $manifestText | ConvertFrom-Json
          if ($manifest.sha256 -ne $env:PAYLOAD_SHA256) {
            throw "The payload manifest checksum '$($manifest.sha256)' does not match the reviewed build checksum '$($env:PAYLOAD_SHA256)'."
          }
          if ($manifest.version -ne $env:SOURCE_VERSION) {
            throw "The payload manifest version '$($manifest.version)' does not match the expected source version '$($env:SOURCE_VERSION)'."
          }

          $payloadText = ''
          foreach ($part in $manifest.parts) {
            $partItem = Invoke-RestMethod -Uri "$api/contents/build-source-patch/$part`?ref=$env:PAYLOAD_BRANCH" -Headers $headers
            # The API returns the part file base64-encoded, and the part file is
            # itself the base64 text of one slice of the source archive. Decode
            # the API envelope once to recover that slice.
            $payloadText += [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($partItem.content -replace '\s','')))
          }
          $payloadBytes = [Convert]::FromBase64String($payloadText)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = ([System.BitConverter]::ToString($sha.ComputeHash($payloadBytes))).Replace('-','').ToLowerInvariant()
          $sha.Dispose()
          if ($hash -ne $env:PAYLOAD_SHA256) {
            throw "The source payload checksum did not match. Expected '$($env:PAYLOAD_SHA256)' but received '$hash'. Refusing to build from an unverified source."
          }
          Write-Host "Source payload verified: $hash"

          $payloadZip = Join-Path $env:RUNNER_TEMP 'whaleradar-source.zip'
          [System.IO.File]::WriteAllBytes($payloadZip, $payloadBytes)
          Expand-Archive -LiteralPath $payloadZip -DestinationPath $buildSrc -Force
          Write-Host 'Source payload expanded over the baseline tree.'

          # The payload is versioned as one unit. Verify the parts instead of
          # patching them, so the build can never ship a mixed version.
          $version = (Get-Content (Join-Path $buildSrc 'BUILD_VERSION.txt') -Raw).Trim()
          if ($version -ne $env:SOURCE_VERSION) {
            throw "Unexpected source version in the payload: '$version'."
          }
          $versionChecks = @{
            'whaleradar\__init__.py' = ('__version__ = "' + $version + '"')
            'setup.iss'             = ('#define MyAppVersion "' + $version + '"')
          }
          foreach ($entry in $versionChecks.GetEnumerator()) {
            $path = Join-Path $buildSrc $entry.Key
            if (-not (Test-Path $path)) { throw "Versioned file is missing: $($entry.Key)." }
            $text = [System.IO.File]::ReadAllText($path)
            if (-not $text.Contains($entry.Value)) {
              throw "Version mismatch in $($entry.Key): expected '$($entry.Value)'."
            }
          }
          Write-Host "Source version verified consistently: $version"

          # The reviewed payload must provide every module and test the build
          # depends on. A missing file must fail the build, not the application.
          $required = @(
            'app.py', 'setup.iss', 'requirements.txt', 'BUILD_VERSION.txt',
            'README_EN.md', 'START_HERE_EN.txt', 'CHANGELOG.md',
            'docs\NETWORK_FIX_1.5.0.md',
            'whaleradar\__init__.py', 'whaleradar\http.py', 'whaleradar\hyperliquid.py',
            'whaleradar\traders.py', 'whaleradar\copycalc.py', 'whaleradar\risk_profile.py',
            'whaleradar\rtl.py', 'whaleradar\trade_manager.py',
            'tests\test_import_smoke.py', 'tests\test_trader_discovery.py',
            'tests\test_http_safety.py', 'tests\test_trade_manager_startup_binding.py',
            'tests\test_rtl.py', 'tests\test_copycalc.py', 'tests\test_risk_profile.py',
            'tests\test_network_diagnostics.py', 'tests\test_trade_manager.py'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $buildSrc $relative))) {
              throw "The source payload is incomplete: '$relative' is missing."
            }
          }

          # Remove guides from earlier versions so only the current one ships.
          Get-ChildItem -Path (Join-Path $buildSrc 'docs') -Filter 'NETWORK_FIX_*.md' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "NETWORK_FIX_$env:SOURCE_VERSION.md" } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }

      - name: Diagnose public endpoint reachability on the Windows runner
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Invoke-PublicProbe([string]$Name, [string]$Uri, [string]$Method = 'GET', [string]$Body = '') {
            try {
              if ($Method -eq 'POST') {
                $response = Invoke-WebRequest -UseBasicParsing -Method POST -Uri $Uri -TimeoutSec 20 -ContentType 'application/json' -Body $Body
              } else {
                $response = Invoke-WebRequest -UseBasicParsing -Method GET -Uri $Uri -TimeoutSec 20
              }
              $status = [int]$response.StatusCode
              $extra = ''
              if ($Name -eq 'Hyperliquid leaderboard') {
                try {
                  $payload = $response.Content | ConvertFrom-Json
                  $extra = " rows=$(@($payload.leaderboardRows).Count)"
                } catch { $extra = ' response_json=invalid' }
              }
              Write-Host "NETWORK_PROBE [$Name] SUCCESS HTTP=$status$extra"
            } catch {
              $status = 'unknown'
              try { if ($_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode } } catch {}
              $detail = $_.Exception.Message
              if ($_.Exception.InnerException) { $detail += ' | ' + $_.Exception.InnerException.Message }
              Write-Host "NETWORK_PROBE [$Name] FAILED HTTP=$status DETAIL=$detail"
            }
          }
          Invoke-PublicProbe 'Hyperliquid leaderboard' 'https://stats-data.hyperliquid.xyz/Mainnet/leaderboard'
          Invoke-PublicProbe 'Hyperliquid info API' 'https://api.hyperliquid.xyz/info' 'POST' '{"type":"metaAndAssetCtxs"}'
          Invoke-PublicProbe 'Bitunix futures public API' 'https://fapi.bitunix.com/api/v1/futures/market/tickers'

      - name: Inspect safe API UI integration points
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $appPath = Join-Path $src 'app.py'
          if (-not (Test-Path $appPath)) { throw 'Source app.py not found for safe UI inspection.' }
          $lines = [System.IO.File]::ReadAllLines($appPath)
          Write-Host '--- SAFE SOURCE INSPECTION: class and method signatures ---'
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^\s*def\s+' -or $lines[$i] -match '^class\s+') {
              Write-Host ('SRC_METHOD|{0}|{1}' -f ($i + 1), $lines[$i].Trim())
            }
          }
          Write-Host '--- SAFE SOURCE INSPECTION: credential UI anchors ---'
          $needles = @('API key','API Key','API secret','API Secret','Save & test connection','Clear saved API keys','Connection test failed','Trader discovery failed','Bitunix API credentials')
          for ($i = 0; $i -lt $lines.Length; $i++) {
            foreach ($needle in $needles) {
              if ($lines[$i].IndexOf($needle, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                $from = [Math]::Max(0, $i - 7)
                $to = [Math]::Min($lines.Length - 1, $i + 11)
                for ($j = $from; $j -le $to; $j++) {
                  Write-Host ('SRC_CONTEXT|{0}|{1}' -f ($j + 1), $lines[$j])
                }
                Write-Host 'SRC_CONTEXT_END'
                break
              }
            }
          }
          Write-Host '--- END SAFE SOURCE INSPECTION ---'

      - name: Install dependencies using resilient PyPI mirrors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path $python)) {
            $found = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($found) { $python = $found.Source } else { throw 'Python was not found on the Windows runner.' }
          }
          & $python --version
          & $python -m venv (Join-Path $src '.venv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the virtual environment.' }
          $venvPython = Join-Path $src '.venv\Scripts\python.exe'
          $mirrors = @(
            'https://pypi.tuna.tsinghua.edu.cn/simple',
            'https://mirrors.aliyun.com/pypi/simple/',
            'https://pypi.org/simple'
          )
          $installed = $false
          foreach ($mirror in $mirrors) {
            Write-Host "Trying dependency mirror: $mirror"
            & $venvPython -m pip install --disable-pip-version-check --default-timeout=120 --retries=10 --index-url $mirror --upgrade pip
            if ($LASTEXITCODE -ne 0) { continue }
            & $venvPython -m pip install --disable-pip-version-check --default-timeout=120 --retries=10 --index-url $mirror -r (Join-Path $src 'requirements.txt') 'pyinstaller>=6,<7'
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
          }
          if (-not $installed) { throw 'Dependency downloads failed from every configured PyPI index.' }

      - name: Test and package the standalone Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          Set-Location $src
          $python = Join-Path $src '.venv\Scripts\python.exe'
          # Every module of the package must compile, including the modules the
          # previous build never checked.
          & $python -m py_compile app.py whaleradar\__init__.py whaleradar\analysis.py whaleradar\backtest.py whaleradar\bitunix.py whaleradar\evm.py whaleradar\exchanges.py whaleradar\http.py whaleradar\hyperliquid.py whaleradar\marketdata.py whaleradar\models.py whaleradar\notifications.py whaleradar\risk.py whaleradar\rtl.py whaleradar\storage.py whaleradar\traders.py whaleradar\copycalc.py whaleradar\risk_profile.py whaleradar\trade_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed.' }
          & $python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          # The full suite runs, including the trader-discovery test that the
          # previous build deleted to hide a failure.
          & $python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          $pyiArgs = @('-m','PyInstaller','--noconfirm','--clean','--windowed','--onefile','--name','WhaleRadarPro','--icon','assets\whaleradar.ico','--add-data','assets\whaleradar.ico;assets','--collect-all','keyring','--hidden-import','winotify','app.py')
          & $python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (-not (Test-Path (Join-Path $src 'dist\WhaleRadarPro.exe'))) { throw 'The standalone EXE was not created.' }
          $exeInfo = Get-Item (Join-Path $src 'dist\WhaleRadarPro.exe')
          if ($exeInfo.Length -lt 5000000) { throw 'EXE artifact is unexpectedly small; refusing to publish it.' }
          Write-Host "EXE verified by existence and size: $($exeInfo.Length) bytes"

      - name: Build and verify required Windows Setup installer
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($winget) { & $winget.Source install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if ($choco) { & $choco.Source install innosetup --yes --no-progress }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host 'Installing Inno Setup from the official signed release because winget/choco are unavailable on this runner.'
            $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installerPath
            $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($installerHash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup installer checksum did not match the published SHA-256.' }
            # Install to a predictable no-spaces directory under the Windows runner's temp root.
            $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
            if (Test-Path $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue }
            $install = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$installDir") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($install.ExitCode)." }
            $iscc = Join-Path $installDir 'ISCC.exe'
            if (-not (Test-Path $iscc)) {
              $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw 'Inno Setup is still unavailable; refusing to publish without the requested Setup installer.' }
          & $iscc (Join-Path $src 'setup.iss')
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed while compiling setup.iss.' }
          $setup = Join-Path $src "Output\WhaleRadarPro-Setup-$env:SOURCE_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "WhaleRadarPro-Setup-$env:SOURCE_VERSION.exe was not created." }
          $setupInfo = Get-Item $setup
          if ($setupInfo.Length -lt 1000000) { throw 'Setup installer is unexpectedly small; refusing to publish it.' }
          Write-Host "Verified Setup installer: $($setupInfo.Length) bytes"

      - name: Stage and publish the verified files
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $root = Join-Path $env:PUBLIC 'Documents\WhaleRadarProBuild'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $publicRelease = Join-Path $root "Release-v$env:SOURCE_VERSION"
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          New-Item -Path $publicRelease -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $dest 'WhaleRadarPro.exe') -Force
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $publicRelease 'WhaleRadarPro.exe') -Force
          $setup = Join-Path $src "Output\WhaleRadarPro-Setup-$env:SOURCE_VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Verified Setup installer is missing; refusing to publish EXE-only output.' }
          Copy-Item $setup (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Force
          Copy-Item $setup (Join-Path $publicRelease 'WhaleRadarPro-Setup.exe') -Force
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $tag = $env:RELEASE_TAG
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $setupHash = (Get-FileHash -LiteralPath (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = Join-Path $dest 'WhaleRadarPro-Setup.sha256.txt'
          [System.IO.File]::WriteAllText($hashFile, "$setupHash  WhaleRadarPro-Setup.exe`r`n", [System.Text.Encoding]::ASCII)
          Copy-Item $hashFile (Join-Path $publicRelease 'WhaleRadarPro-Setup.sha256.txt') -Force

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            $status = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
          }
          if ($release -and -not $release.draft) {
            throw "The $env:SOURCE_VERSION release already exists as a published immutable release; use a new version tag."
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = "Whale Radar Pro $env:SOURCE_VERSION - Windows x64"
              body = "English-only Whale Radar Pro $env:SOURCE_VERSION. Fixes the Successful Traders screen, where the trader service was missing the discover method the screen calls, so the ranking could not be refreshed. A trading order is now submitted with one client ID that is stored in the local history, and an order that the exchange accepted but that could not be recorded locally is reported explicitly instead of looking like a failed copy. A trading POST is attempted exactly once; timeouts, resets and HTTP 408/425/5xx raise an explicit ambiguous-submission error. Credential-shaped values are redacted from every error message and diagnostic entry, response bodies are size-capped, and the leaderboard cache no longer blocks the user interface. Copy sizing uses exact decimal arithmetic and refuses a protective level at or below zero. An optional account equity derives automatic leverage, daily loss and open risk guardrails. The previous transport module and the Trade Manager position renderer contained syntax errors that the build used to repair silently at package time; both are fixed in the source. The full test suite now runs, including the trader-discovery test the previous build deleted. Hyperliquid remains read-only, every copy trade still requires individual approval, and this app does not bypass regional or service restrictions."
              draft = $true
              prerelease = $false
            } | ConvertTo-Json -Compress
            $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payloadBytes
          }
          $uploadBase = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets"
          $assets = Get-ChildItem $dest -File
          foreach ($item in $assets) {
            $name = [System.IO.Path]::GetFileName($item.FullName)
            foreach ($oldAsset in @($release.assets | Where-Object { $_.name -eq $name })) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($oldAsset.id)" -Headers $headers | Out-Null
            }
            $uploadUrl = "$($uploadBase)?name=$([uri]::EscapeDataString($name))"
            Write-Host "Uploading $name ($($item.Length) bytes)"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -ContentType 'application/octet-stream' -InFile $item.FullName | Out-Null
          }
          $publishBytes = [System.Text.Encoding]::UTF8.GetBytes('{"draft":false}')
          $published = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $publishBytes
          Write-Host "Published verified files to $($published.html_url)"
          Get-ChildItem $publicRelease | Select-Object Name, Length
