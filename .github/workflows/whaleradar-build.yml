name: Build Whale Radar Pro (Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whaleradar-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Wait for source extracted into the shared Public folder
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:PUBLIC 'Documents\WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'),
            'C:\Users\Public\Documents\WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'
          )
          $src = $null
          for ($i = 0; $i -lt 120; $i++) {
            foreach ($candidate in $candidates) {
              if (Test-Path (Join-Path $candidate 'build_windows.bat') -ErrorAction SilentlyContinue) {
                $src = $candidate
                break
              }
            }
            if ($src) { break }
            Write-Host 'Waiting for the one-click helper to extract the source into the shared folder...'
            Start-Sleep -Seconds 5
          }
          if (-not $src) { throw 'Source not found. Run WhaleRadarPro_AutoBuild_Mirrors.bat once; it extracts the source into the Public Documents folder.' }
          $buildSrc = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          if (Test-Path $buildSrc) { Remove-Item $buildSrc -Recurse -Force }
          New-Item -ItemType Directory -Path $buildSrc -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $buildSrc -Recurse -Force
          Write-Host "Copied source to runner workspace: $buildSrc"

      - name: Install dependencies using alternative PyPI mirrors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path $python)) {
            $found = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($found) { $python = $found.Source } else { throw 'Python was not found on the Windows runner.' }
          }
          & $python --version
          & $python -m venv (Join-Path $src '.venv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the virtual environment.' }
          $venvPython = Join-Path $src '.venv\Scripts\python.exe'
          $mirrors = @(
            'https://pypi.tuna.tsinghua.edu.cn/simple',
            'https://mirrors.aliyun.com/pypi/simple/'
          )
          $installed = $false
          foreach ($mirror in $mirrors) {
            Write-Host "Trying dependency mirror: $mirror"
            & $venvPython -m pip --default-timeout=120 --retries=10 --index-url $mirror install --upgrade pip
            if ($LASTEXITCODE -ne 0) { continue }
            & $venvPython -m pip --default-timeout=120 --retries=10 --index-url $mirror install -r (Join-Path $src 'requirements.txt') pyinstaller
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
          }
          if (-not $installed) { throw 'Dependency downloads failed from both mirrors.' }

      - name: Test and package the standalone Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          Set-Location $src
          $python = Join-Path $src '.venv\Scripts\python.exe'
          & $python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          & $python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          $pyiArgs = @('-m','PyInstaller','--noconfirm','--clean','--windowed','--onefile','--name','WhaleRadarPro','--icon','assets\whaleradar.ico','--add-data','assets\whaleradar.ico;assets','--collect-all','keyring','--hidden-import','winotify','app.py')
          & $python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (-not (Test-Path (Join-Path $src 'dist\WhaleRadarPro.exe'))) { throw 'The standalone EXE was not created.' }

      - name: Build installer if Inno Setup is available
        shell: powershell
        continue-on-error: true
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if ($choco) {
              & $choco.Source install innosetup --yes --no-progress
              $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if ($iscc) {
            & $iscc (Join-Path $src 'setup.iss')
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Setup compilation failed; the standalone EXE will still be released.' }
          } else {
            Write-Warning 'Inno Setup is unavailable on this runner; releasing the standalone EXE only.'
          }

      - name: Stage release files
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'WhaleRadarPro_BitunixOnly'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $dest 'WhaleRadarPro.exe') -Force
          $setup = Join-Path $src 'Output\WhaleRadarPro-Setup.exe'
          if (Test-Path $setup) { Copy-Item $setup (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Force }
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Publish EXE files to the GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $tag = 'whaleradarpro-v1.0.0'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            $body = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Whale Radar Pro 1.0.0 - Windows'
              body = 'Whale Radar Pro 1.0.0 for Windows x64. Bitunix is the only configured exchange connection in this build.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json -Depth 5
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $body
          }
          $uploadBase = $release.upload_url.Split('{')[0]
          $assetDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $assets = Get-ChildItem $assetDir -File
          foreach ($item in $assets) {
            foreach ($old in @($release.assets | Where-Object { $_.name -eq $item.Name })) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($old.id)" -Headers $headers | Out-Null
            }
            $uploadUrl = "$uploadBase?name=$([uri]::EscapeDataString($item.Name))"
            Write-Host "Uploading $($item.Name)"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -ContentType 'application/octet-stream' -InFile $item.FullName | Out-Null
          }
          Write-Host "Release available at: $($release.html_url)"
