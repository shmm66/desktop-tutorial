name: Build Whale Radar Pro (Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whaleradar-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Locate Whale Radar Pro source on the Windows PC
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'),
            'C:\Users\Hajix\AppData\Local\WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'
          )
          $src = $candidates | Where-Object { Test-Path (Join-Path $_ 'build_windows.bat') } | Select-Object -First 1
          if (-not $src) {
            throw 'Could not find extracted Whale Radar Pro source. Run the helper file once so it extracts the source ZIP.'
          }
          Write-Host "Source located at: $src"

      - name: Build EXE and installer using resilient package mirrors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'),
            'C:\Users\Hajix\AppData\Local\WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'
          )
          $src = $candidates | Where-Object { Test-Path (Join-Path $_ 'build_windows.bat') } | Select-Object -First 1
          if (-not $src) { throw 'Whale Radar Pro source folder is missing.' }
          Set-Location $src
          $env:PIP_DEFAULT_TIMEOUT = '120'
          $env:PIP_RETRIES = '10'
          $env:PIP_DISABLE_PIP_VERSION_CHECK = '1'
          $mirrors = @(
            'https://pypi.tuna.tsinghua.edu.cn/simple',
            'https://mirrors.aliyun.com/pypi/simple/'
          )
          $success = $false
          foreach ($mirror in $mirrors) {
            Write-Host "Trying package index: $mirror"
            $env:PIP_INDEX_URL = $mirror
            cmd /d /c "call build_windows.bat <NUL"
            if (Test-Path (Join-Path $src 'Output\WhaleRadarPro-Setup.exe')) {
              $success = $true
              break
            }
            Write-Host "Build did not finish with this mirror; trying the next one."
          }
          if (-not $success) {
            throw 'The Windows build did not produce Output\WhaleRadarPro-Setup.exe. Check this workflow log for the first dependency/build error.'
          }
          if (-not (Test-Path (Join-Path $src 'dist\WhaleRadarPro.exe'))) {
            throw 'Installer was created but the standalone EXE is missing.'
          }

      - name: Stage files for release
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'),
            'C:\Users\Hajix\AppData\Local\WhaleRadarProBuild\WhaleRadarPro_BitunixOnly'
          )
          $src = $candidates | Where-Object { Test-Path (Join-Path $_ 'build_windows.bat') } | Select-Object -First 1
          if (-not $src) { throw 'Whale Radar Pro source folder is missing while staging release files.' }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $src 'Output\WhaleRadarPro-Setup.exe') (Join-Path $dest 'WhaleRadarPro-Setup.exe') -Force
          Copy-Item (Join-Path $src 'dist\WhaleRadarPro.exe') (Join-Path $dest 'WhaleRadarPro.exe') -Force
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Publish downloadable Windows files using GitHub API
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repo"
          $tag = 'whaleradarpro-v1.0.0'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
            Write-Host "Updating existing release $tag"
          } catch {
            $body = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Whale Radar Pro 1.0.0 - Windows'
              body = 'Whale Radar Pro 1.0.0 for Windows x64. Bitunix is the only configured exchange connection in this build.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json -Depth 5
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $body
          }
          $uploadBase = $release.upload_url.Split('{')[0]
          $assetMap = @(
            @{ Name = 'WhaleRadarPro-Setup.exe'; Path = (Join-Path $env:GITHUB_WORKSPACE 'release-assets\WhaleRadarPro-Setup.exe') },
            @{ Name = 'WhaleRadarPro.exe'; Path = (Join-Path $env:GITHUB_WORKSPACE 'release-assets\WhaleRadarPro.exe') }
          )
          foreach ($item in $assetMap) {
            if (-not (Test-Path $item.Path)) { throw "Missing release file: $($item.Path)" }
            foreach ($old in @($release.assets | Where-Object { $_.name -eq $item.Name })) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($old.id)" -Headers $headers | Out-Null
            }
            $uploadUrl = "$uploadBase?name=$([uri]::EscapeDataString($item.Name))"
            Write-Host "Uploading $($item.Name)"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -ContentType 'application/octet-stream' -InFile $item.Path | Out-Null
          }
          Write-Host "Release available at: $($release.html_url)"
