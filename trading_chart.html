<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trader Planner Pro — Trading Desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#071019;color:#eaf2f7;font:14px Segoe UI,Arial;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#0b1420,#081018 55%,#101c2a)}.bar{height:58px;display:flex;align-items:center;gap:7px;padding:7px 10px;background:rgba(20,32,47,.72);backdrop-filter:blur(22px);border-bottom:1px solid rgba(120,180,220,.18)}button,select,input{background:rgba(28,43,61,.8);color:#eaf2f7;border:1px solid #294156;border-radius:9px;padding:7px 9px}button:hover{border-color:#42d8bd;background:#20384b;cursor:pointer}.brand{font-weight:800;color:#5ee3ca;margin-right:6px}.tools{display:flex;gap:4px;flex-wrap:wrap}.tools button.active{background:#2ad0b2;color:#061019}.grow{flex:1}.stage{position:relative;flex:1;min-height:0}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.status{position:absolute;left:12px;bottom:12px;background:rgba(8,16,25,.78);backdrop-filter:blur(12px);border:1px solid #294156;border-radius:12px;padding:7px 10px;color:#9fb1c0;font-size:12px}.hint{position:absolute;right:12px;bottom:12px;background:rgba(8,16,25,.65);border:1px solid #294156;border-radius:12px;padding:7px 10px;color:#90a3b3;font-size:11px}.side{position:absolute;right:10px;top:10px;width:190px;background:rgba(15,25,37,.72);backdrop-filter:blur(18px);border:1px solid rgba(130,190,230,.16);border-radius:14px;padding:9px;display:none}.side.open{display:block}.row{display:flex;gap:5px;margin:5px 0}.row>*{flex:1}.replay{display:flex;align-items:center;gap:5px}.pill{font-size:11px;color:#7de6d0}
</style></head><body><div id="app"><div class="bar"><span class="brand">TRADING DESK</span><select id="sym"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option><option>XRPUSDT</option><option>ADAUSDT</option><option>DOGEUSDT</option><option>AVAXUSDT</option><option>LINKUSDT</option><option>TRXUSDT</option></select><select id="tf"><option value="1m">1m</option><option value="3m">3m</option><option value="5m">5m</option><option value="15m">15m</option><option value="30m">30m</option><option value="1h">1H</option><option value="4h">4H</option><option value="1d">1D</option><option value="1w">1W</option></select><div class="tools" id="tools"></div><div class="grow"></div><button id="replay">▶ Replay</button><button id="fit">Fit</button><button id="clear">Clear</button><button id="fs">⛶</button></div><div class="stage"><canvas id="c"></canvas><div class="status" id="status">Loading market…</div><div class="hint">Wheel: zoom • Drag: pan • Touch: pan/zoom • Drawings stay anchored</div></div></div><script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d'),stage=document.querySelector('.stage');let W,H,dpr=1,data=[],draw=[],tool='select',drag=false,lastX=0,lastY=0,view={start:0,end:0,min:0,max:0},replay=false,replayN=0;
const tools=[['select','↖'],['trend','╱'],['hline','—'],['vline','│'],['rect','▭'],['fib','F'],['arrow','➜'],['text','T'],['brush','✎'],['measure','↔'],['long','L'],['short','S'],['erase','⌫']];
for(const [k,l] of tools){let b=document.createElement('button');b.textContent=l;b.title=k;b.dataset.k=k;b.onclick=()=>{tool=k;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x.dataset.k===k))};document.getElementById('tools').append(b)}document.querySelector('#tools button').classList.add('active');
function resize(){dpr=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);render()}addEventListener('resize',resize);resize();
function gen(n=500){let p=50000+(Math.random()-.5)*5000;data=[];for(let i=0;i<n;i++){let o=p,c=o+(Math.random()-.49)*1200,h=Math.max(o,c)+Math.random()*700,l=Math.min(o,c)-Math.random()*700;p=c;data.push({t:Date.now()-((n-i)*60000),o,h,l,c})}fit()}
async function load(){let s=document.getElementById('sym').value,tf=document.getElementById('tf').value;try{let q=await fetch(`https://api.binance.com/api/v3/klines?symbol=${s}&interval=${tf}&limit=700`);let a=await q.json();if(!Array.isArray(a)||!a.length)throw 0;data=a.map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));document.getElementById('status').textContent=`LIVE • ${s} • ${tf}`;fit()}catch(e){gen();document.getElementById('status').textContent=`DEMO • ${s} • ${tf} (network unavailable)`}}
function fit(){view.start=Math.max(0,data.length-180);view.end=data.length;let a=data.slice(view.start,view.end);view.min=Math.min(...a.map(x=>x.l));view.max=Math.max(...a.map(x=>x.h));render()}
function geo(i,p){let x=55+(i-view.start)/(Math.max(1,view.end-view.start))*Math.max(1,W-95);let y=18+(view.max-p)/Math.max(1e-9,view.max-view.min)*(H-55);return[x,y]};function idxX(x){return Math.round(view.start+(x-55)/(W-95)*(view.end-view.start))};function priceY(y){return view.max-(y-18)/(H-55)*(view.max-view.min)}
function render(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#071019';ctx.fillRect(0,0,W,H);if(!data.length)return;let a=data.slice(view.start,view.end),cw=Math.max(2,(W-100)/Math.max(1,a.length)-2);for(let j=0;j<a.length;j++){let d=a[j],i=view.start+j,[x,yo]=geo(i,d.o),[,yh]=geo(i,d.h),[,yl]=geo(i,d.l),[,yc]=geo(i,d.c),up=d.c>=d.o;ctx.strokeStyle=up?'#35d6b3':'#ff6f7d';ctx.fillStyle=up?'#35d6b3':'#ff6f7d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yh);ctx.lineTo(x,yl);ctx.stroke();ctx.fillRect(x-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)))}ctx.strokeStyle='rgba(130,180,220,.12)';ctx.lineWidth=1;for(let y=60;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const d of draw)paint(d);ctx.fillStyle='#90a3b3';ctx.font='11px Segoe UI';for(let k=0;k<5;k++){let p=view.max-(view.max-view.min)*k/4;ctx.fillText(p.toFixed(2),W-86,24+(H-70)*k/4)}}
function paint(d){let [x1,y1]=geo(d.i1,d.p1),[x2,y2]=geo(d.i2??d.i1,d.p2??d.p1);ctx.strokeStyle=d.color||'#ff4b55';ctx.fillStyle=(d.color||'#ff4b55')+'22';ctx.lineWidth=2;ctx.beginPath();if(d.type==='hline'){ctx.moveTo(0,y1);ctx.lineTo(W,y1)}else if(d.type==='vline'){ctx.moveTo(x1,0);ctx.lineTo(x1,H)}else if(d.type==='rect'){ctx.rect(x1,y1,x2-x1,y2-y1);ctx.fill()}else if(d.type==='trend'||d.type==='arrow'||d.type==='measure'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);if(d.type==='arrow'){let a=Math.atan2(y2-y1,x2-x1);ctx.lineTo(x2-10*Math.cos(a-.5),y2-10*Math.sin(a-.5));ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a+.5),y2-10*Math.sin(a+.5))}}else if(d.type==='fib'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y1);for(let r of [0,.236,.382,.5,.618,1]){let y=y1+(y2-y1)*r;ctx.moveTo(x1,y);ctx.lineTo(x2,y)}}else if(d.type==='text'){ctx.font='13px Segoe UI';ctx.fillStyle='#eaf2f7';ctx.fillText(d.text||'Text',x1,y1)}else if(d.type==='brush'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)}else if(d.type==='long'||d.type==='short'){ctx.strokeRect(x1,y1,x2-x1,y2-y1);ctx.fillText(d.type==='long'?'LONG':'SHORT',x1+5,y1+15)}ctx.stroke()}
function pointer(e){let r=cvs.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};cvs.addEventListener('pointerdown',e=>{let [x,y]=pointer(e);if(tool==='select'){drag=true;lastX=x;lastY=y;return}if(tool==='erase'){let ix=idxX(x);draw=draw.filter(d=>Math.abs((d.i1||0)-ix)>6);render();return}let i=Math.max(0,Math.min(data.length-1,idxX(x))),p=priceY(y);if(tool==='hline'||tool==='vline')draw.push({type:tool,i1:i,p1:p,i2:i,p2:p});else draw.push({type:tool,i1:i,p1:p,i2:i,p2:p});drag=true;lastX=x;lastY=y;e.target.setPointerCapture(e.pointerId)});cvs.addEventListener('pointermove',e=>{if(!drag)return;let [x,y]=pointer(e);if(tool==='select'){let di=Math.round((x-lastX)/(W-95)*(view.end-view.start));view.start=Math.max(0,Math.min(data.length-20,view.start-di));view.end=Math.min(data.length,view.end-di);let a=data.slice(view.start,view.end);view.min=Math.min(...a.map(x=>x.l));view.max=Math.max(...a.map(x=>x.h));lastX=x;render();return}let d=draw[draw.length-1];if(!d)return;d.i2=Math.max(0,Math.min(data.length-1,idxX(x)));d.p2=priceY(y);render()});cvs.addEventListener('pointerup',e=>{drag=false;if(tool==='text'){let d=draw[draw.length-1];d.text=prompt('Text','ICT / Setup')||'Text';render()}});cvs.addEventListener('wheel',e=>{e.preventDefault();let factor=e.deltaY>0?1.12:.89,mid=idxX(pointer(e)[0]),span=(view.end-view.start)*factor;span=Math.max(30,Math.min(data.length,span));view.start=Math.max(0,Math.min(data.length-span,mid-span/2));view.end=view.start+span;let a=data.slice(Math.floor(view.start),Math.ceil(view.end));view.min=Math.min(...a.map(x=>x.l));view.max=Math.max(...a.map(x=>x.h));render()},{passive:false});
document.getElementById('fit').onclick=fit;document.getElementById('clear').onclick=()=>{draw=[];render()};document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('replay').onclick=()=>{replay=!replay;document.getElementById('replay').textContent=replay?'■ Stop Replay':'▶ Replay';if(replay){replayN=Math.max(40,view.start+40);step()}};function step(){if(!replay)return;if(replayN>=data.length){replay=false;document.getElementById('replay').textContent='▶ Replay';return}view.end=++replayN;let a=data.slice(Math.max(0,view.start),view.end);view.min=Math.min(...a.map(x=>x.l));view.max=Math.max(...a.map(x=>x.h));render();setTimeout(step,120)}document.getElementById('sym').onchange=load;document.getElementById('tf').onchange=load;load();
</script></body></html>
